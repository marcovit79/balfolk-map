<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cordova Mobile App Simulator - Festival Maps</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --panel-bg: #1e293b;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success: #10b981;
      --danger: #ef4444;
      --device-width: 412px;
      --device-height: 915px;
      --device-radius: 44px;
      --bezel-width: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    header {
      background-color: var(--panel-bg);
      border-bottom: 1px solid #334155;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      font-size: 1.1rem;
    }

    .brand span {
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .select-wrap select {
      background: #0f172a;
      border: 1px solid #475569;
      color: #f8fafc;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      cursor: pointer;
      outline: none;
    }

    button {
      background: #0f172a;
      border: 1px solid #475569;
      color: #f8fafc;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    button:hover {
      background: #334155;
      border-color: #64748b;
    }

    .btn-primary {
      background: var(--primary);
      border-color: var(--primary);
    }

    .btn-primary:hover {
      background: var(--primary-hover);
      border-color: var(--primary-hover);
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .status-badge.error {
      background: rgba(239, 68, 68, 0.15);
      color: var(--danger);
      border-color: rgba(239, 68, 68, 0.3);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: currentColor;
    }

    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px;
      background-image: radial-gradient(#1e293b 1px, transparent 1px);
      background-size: 24px 24px;
    }

    /* Device Mockup */
    .device-container {
      position: relative;
      width: var(--device-width);
      height: var(--device-height);
      background: #000;
      border-radius: var(--device-radius);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 0 var(--bezel-width) #1e293b, 0 0 0 calc(var(--bezel-width) + 2px) #334155;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: width 0.3s ease, height 0.3s ease;
    }

    /* Camera notch / punch hole */
    .device-notch {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 14px;
      height: 14px;
      background: #0f172a;
      border-radius: 50%;
      z-index: 50;
      border: 2px solid #000;
    }

    /* Status Bar Mockup */
    .device-statusbar {
      height: 32px;
      background: #0f172a;
      color: #94a3b8;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      font-size: 0.75rem;
      font-weight: 600;
      z-index: 40;
      user-select: none;
    }

    .device-screen {
      flex: 1;
      position: relative;
      background: #fff;
      overflow: hidden;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Home Bar / Gesture pill */
    .device-homebar {
      height: 20px;
      background: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 40;
    }

    .home-indicator {
      width: 120px;
      height: 4px;
      background: #64748b;
      border-radius: 2px;
    }

    /* Device Orientation Landscape */
    .landscape {
      --device-width: 915px;
      --device-height: 412px;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span>📱 FestivalMap Mobile Simulator</span>
      <span style="font-size: 0.8rem; color: var(--text-muted); font-weight: normal;">(Cordova Android WebView)</span>
    </div>

    <div class="controls">
      <div class="select-wrap">
        <select id="deviceSelector" onchange="changeDevice(this.value)">
          <option value="pixel7">Google Pixel 7 (412 × 915)</option>
          <option value="galaxy">Samsung Galaxy S22 (360 × 780)</option>
          <option value="iphone14">iPhone 14 Pro (393 × 852)</option>
          <option value="tablet">Android Tablet (768 × 1024)</option>
        </select>
      </div>

      <button onclick="toggleOrientation()" title="Rotate Device">
        🔄 Rotate
      </button>

      <button onclick="reloadFrame()" title="Reload App">
        ⚡ Reload
      </button>

      <button onclick="openRaw()" title="Open App in New Tab">
        ↗ Fullscreen
      </button>

      <div id="backendStatus" class="status-badge">
        <div class="status-dot"></div>
        <span id="backendStatusText">Backend Gateway: checking...</span>
      </div>
    </div>
  </header>

  <main>
    <div id="deviceFrame" class="device-container">
      <div class="device-notch"></div>
      <div class="device-statusbar">
        <span id="currentTime">12:00</span>
        <div style="display: flex; gap: 8px;">
          <span>5G</span>
          <span>📶</span>
          <span>100% 🔋</span>
        </div>
      </div>
      <div class="device-screen">
        <iframe id="appFrame" src="/app/index.html"></iframe>
      </div>
      <div class="device-homebar">
        <div class="home-indicator"></div>
      </div>
    </div>
  </main>

  <script>
    // Update status bar clock
    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('currentTime').textContent = `${hours}:${minutes}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    const devices = {
      pixel7: { width: '412px', height: '915px', radius: '44px' },
      galaxy: { width: '360px', height: '780px', radius: '40px' },
      iphone14: { width: '393px', height: '852px', radius: '48px' },
      tablet: { width: '768px', height: '1024px', radius: '28px' }
    };

    let currentDevice = 'pixel7';
    let isLandscape = false;

    function applyDimensions() {
      const root = document.documentElement;
      const dev = devices[currentDevice];
      if (isLandscape) {
        root.style.setProperty('--device-width', dev.height);
        root.style.setProperty('--device-height', dev.width);
      } else {
        root.style.setProperty('--device-width', dev.width);
        root.style.setProperty('--device-height', dev.height);
      }
      root.style.setProperty('--device-radius', dev.radius);
    }

    function changeDevice(devKey) {
      currentDevice = devKey;
      applyDimensions();
    }

    function toggleOrientation() {
      isLandscape = !isLandscape;
      applyDimensions();
    }

    function reloadFrame() {
      const frame = document.getElementById('appFrame');
      frame.src = frame.src;
    }

    function openRaw() {
      window.open('/app/index.html', '_blank');
    }

    // Ping API Gateway endpoint to show live backend status
    async function checkBackend() {
      const badge = document.getElementById('backendStatus');
      const text = document.getElementById('backendStatusText');
      try {
        const res = await fetch('/api/be_fa/events', { method: 'GET' });
        if (res.ok) {
          badge.className = 'status-badge';
          text.textContent = 'Gateway & Microservices: Online (200)';
        } else {
          badge.className = 'status-badge error';
          text.textContent = `Gateway: HTTP ${res.status}`;
        }
      } catch (err) {
        badge.className = 'status-badge error';
        text.textContent = 'Gateway: Offline (:8080)';
      }
    }

    setInterval(checkBackend, 5000);
    checkBackend();
  </script>
</body>
</html>
